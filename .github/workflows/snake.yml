name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a78bfa&color_dots=#ebedf0,#fbcfe8,#f9a8d4,#f472b6,#db2777
            dist/snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#5b2149,#9d2f6f,#e15aa0,#f9a8d4

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
