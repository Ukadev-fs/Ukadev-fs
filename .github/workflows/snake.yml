name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6b2d5c&color_dots=#ebedf0,#f6c7cd,#ee95a2,#e46a7d,#c7304a
            dist/snake-dark.svg?palette=github-dark&color_snake=#f59e4b&color_dots=#161b22,#4a1d2e,#7a2640,#b0334f,#e0475b

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
