name: Sky

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/sky.mjs
      - tools/art.mjs
      - .github/workflows/sky.yml

permissions:
  contents: write

concurrency:
  group: sky
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node tools/sky.mjs dist

      # Une branche à part : celle du serpent (`output`) est remplacée en entier à chaque dessin.
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: sky
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
